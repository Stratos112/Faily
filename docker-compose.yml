services:
  faily:
    build: .
    image: faily:latest
    ports:
      - "7842:7842"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./piper_checkpoints:/app/piper_checkpoints
      - ./config:/app/config
    # Never set FAILY_NATIVE=1 — that path spins up a pywebview native window,
    # which doesn't exist in a headless container.
    # Optional settings (see README): FAILY_PASSWORD, FAILY_USER, HF_TOKEN,
    # FAILY_VRAM_RESERVE_GB.
    # environment:
    #   - FAILY_PASSWORD=change-me
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
